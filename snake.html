
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:white;
  font-family:Arial,sans-serif;text-align:center;
  padding:20px 12px
}
h1{color:#52ff9a}
.panel{max-width:420px;margin:auto}
.stats{display:flex;justify-content:space-around;
  margin:15px 0;font-size:18px}
canvas{width:100%;max-width:400px;
  background:#111b2c;border:2px solid #52ff9a;
  border-radius:12px;display:block;margin:auto}
button{
  background:#52ff9a;color:#07130b;border:0;
  border-radius:10px;padding:13px 18px;
  font-size:17px;font-weight:bold;cursor:pointer;
  touch-action:manipulation
}
.controls{
  display:grid;grid-template-columns:repeat(3,65px);
  justify-content:center;gap:8px;margin-top:18px
}
.controls button{padding:12px;font-size:22px}
.controls .empty{visibility:hidden}
#message{min-height:28px;color:#ffd166;margin:12px}
</style>
</head>
<body>
<div class="panel">
  <h1>🐍 SNAKE GAME</h1>
  <p>Алманы жина да, рекорд орнат!</p>
  <div class="stats">
    <span>Ұпай: <b id="score">0</b></span>
    <span>Рекорд: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="message">Бастау батырмасын бас!</div>
  <button onclick="startGame()">▶ Бастау / Қайта бастау</button>
  <div class="controls">
    <span class="empty"></span>
    <button onclick="turn(0,-1)">⬆️</button>
    <span class="empty"></span>
    <button onclick="turn(-1,0)">⬅️</button>
    <button onclick="turn(0,1)">⬇️</button>
    <button onclick="turn(1,0)">➡️</button>
  </div>
  <p style="color:#9ca8bd;font-size:13px">
    Компьютер: ← ↑ → ↓ немесе WASD
  </p>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const size=20, cells=20;
let snake,food,dx,dy,nextX,nextY,score,timer,running;
let best=0;
try{best=Number(localStorage.getItem('snakeBest'))||0}catch(e){}
document.getElementById('best').textContent=best;

function placeFood(){
  do{
    food={x:Math.floor(Math.random()*cells),
          y:Math.floor(Math.random()*cells)};
  }while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function draw(){
  ctx.fillStyle='#111b2c';
  ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='#1a2940';
  for(let i=0;i<=400;i+=size){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);
    ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke();
  }
  ctx.fillStyle='#ff5277';
  ctx.beginPath();
  ctx.arc(food.x*size+10,food.y*size+10,8,0,Math.PI*2);
  ctx.fill();
  snake.forEach((p,i)=>{
    ctx.fillStyle=i===0?'#a2ffbd':'#42db83';
    ctx.beginPath();
    ctx.roundRect(p.x*size+1,p.y*size+1,18,18,5);
    ctx.fill();
  });
}
function startGame(){
  clearInterval(timer);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dx=1;dy=0;nextX=1;nextY=0;score=0;running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('message').textContent='Ойын басталды!';
  placeFood();draw();
  timer=setInterval(tick,120);
}
function turn(x,y){
  if(!running)return;
  if(x===-dx&&y===-dy)return;
  nextX=x;nextY=y;
}
function tick(){
  dx=nextX;dy=nextY;
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  const eating=head.x===food.x&&head.y===food.y;
  if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||
    snake.slice(0,eating?snake.length:snake.length-1)
      .some(p=>p.x===head.x&&p.y===head.y)){
    running=false;clearInterval(timer);
    document.getElementById('message').textContent=
      'Ойын аяқталды! Ұпай: '+score;
    return;
  }
  snake.unshift(head);
  if(eating){
    score+=10;
    document.getElementById('score').textContent=score;
    if(score>best){
      best=score;
      document.getElementById('best').textContent=best;
      try{localStorage.setItem('snakeBest',best)}catch(e){}
    }
    placeFood();
    if(score%50===0){
      clearInterval(timer);
      timer=setInterval(tick,Math.max(55,120-score/5));
    }
  }else snake.pop();
  draw();
}
document.addEventListener('keydown',e=>{
  const keys={
    ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],
    ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]
  };
  const k=keys[e.key]||keys[e.key.toLowerCase()];
  if(k){e.preventDefault();turn(k[0],k[1])}
});
draw();
</script>
</body>
</html>
